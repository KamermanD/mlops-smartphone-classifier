train:
  batch_size: 4
  device: cuda
  output_dir: outputs/models
  num_samples: 100

  stages:
    1:
      layers: ["head"]
      lr: 1e-4
      epochs: 1
      wd: 0.0
    2:
      layers: [-1]
      lr: 1e-5
      epochs: 1
      wd: 9e-5
    3:
      layers: [-2, -1]
      lr: 1e-6
      epochs: 1
      wd: 1e-4
    4:
      layers: [-3, -2, -1]
      lr: 1e-7
      epochs: 1
      wd: 2e-4
